    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cuunhi_font_size');
          var map = {
            sm: '14px',
            md: '16px',
            lg: '18px',
            xl: '20.5px',
            '2xl': '23.5px',
            '3xl': '27px',
            '4xl': '31px'
          };
          if (!saved || !map[saved]) {
            saved = 'md';
          }
          document.documentElement.style.fontSize = map[saved] || '16px';
        } catch (e) {}

        // Tự động phục hồi gói kịch bản từ bản sao dự phòng nếu mạng hoặc CDN gặp sự cố tải gói chính
        var retriedMap = {};
        window.addEventListener('error', function(ev) {
          var t = ev && ev.target;
          if (t && t.tagName === 'SCRIPT' && t.src && t.src.indexOf('/assets/') !== -1 && !retriedMap[t.src]) {
            retriedMap[t.src] = true;
            var idx = t.src.indexOf('/assets/');
            var assetPath = t.src.slice(idx);
            var mirrorSrc = 'https://khietvidai.github.io/huyen-hoc-site' + assetPath;
            if (t.src !== mirrorSrc) {
              var s = document.createElement('script');
              s.type = 'module';
              s.crossOrigin = 'anonymous';
              s.src = mirrorSrc;
              document.head.appendChild(s);
            }
          }
        }, true);
      })();
    </script>
    <script src="https://apis.google.com/js/api.js" async defer></script>

        <style>@keyframes cuunhiSpin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
